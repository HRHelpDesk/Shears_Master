apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.shearsmobile"

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26
        versionName "0.0026"
    }

    // === PRODUCT FLAVORS ===
    flavorDimensions "app"
    productFlavors {
        shear {
            dimension "app"
            applicationId "com.shears.shear"
            resValue "string", "app_name", "Shear"
            manifestPlaceholders.appIcon = "@mipmap/ic_shear"
        }
        purpose {
            dimension "app"
            applicationId "com.shears.purpose"
            resValue "string", "app_name", "Purpose"
            manifestPlaceholders.appIcon = "@mipmap/ic_purpose"
        }
        bossCrowns {
            dimension "app"
            applicationId "com.bosscrowns.bcia"
            resValue "string", "app_name", "Boss Crowns Influencer"
            manifestPlaceholders.appIcon = "@mipmap/ic_bosscrowns"
        }
    }

    // === PER-FLAVOR RESOURCES ===
    sourceSets {
        shear.res.srcDirs = ['src/shear/res']
        purpose.res.srcDirs = ['src/purpose/res']
        bossCrowns.res.srcDirs = ['src/bossCrowns/res']
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('KEYSTORE_PASSWORD')) {
                storeFile file('my-upload-key.keystore')
                storePassword project.property("KEYSTORE_PASSWORD")
                keyAlias project.property("KEY_ALIAS")
                keyPassword project.property("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug { 
            signingConfig signingConfigs.debug 
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}